<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Audiobook — Funções Inorgânicas: Ácidos</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c1c0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ácidos">
<link rel="apple-touch-icon" href="imagens/apple-touch-icon.png">
<link rel="icon" type="image/png" href="imagens/icon-192.png">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #10141d; touch-action: none; }
  #hint {
    position: absolute; bottom: 86px; left: 50%; transform: translateX(-50%);
    color: #eaf7d9; font-family: system-ui, sans-serif; font-size: 13px;
    background: rgba(11, 26, 12, 0.9); padding: 8px 16px; border-radius: 20px;
    pointer-events: none; transition: opacity 1s; white-space: nowrap; opacity: 0;
  }

  /* ================= UI do Audiobook ================= */
  :root {
    --acid: #a6e534;
    --acid-2: #6dbf1d;
    --acid-glow: rgba(166, 229, 52, 0.45);
    --painel: rgba(11, 26, 12, 0.92);
    --texto: #eaf7d9;
    --rosa: #ff5db1;
    --rosa-glow: rgba(255, 93, 177, 0.5);
    --ferrugem: #cf6a2f;
    --ferrugem-glow: rgba(207, 106, 47, 0.5);
  }
  button { font-family: system-ui, sans-serif; }

  /* ---------- Capa ---------- */
  #cover {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; text-align: center; color: var(--texto);
    font-family: system-ui, sans-serif; overflow: hidden;
    padding: 0 20px;
    background:
      radial-gradient(circle at 50% 20%, rgba(166,229,52,.16), transparent 45%),
      radial-gradient(circle at 85% 88%, rgba(109,191,29,.10), transparent 42%),
      linear-gradient(165deg, #060d06 0%, #0c1c0b 55%, #050f06 100%);
    transition: opacity .5s;
  }
  #cover.saindo { opacity: 0; pointer-events: none; }

  /* fundo: equações químicas animadas */
  #eqBg {
    position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  .eq {
    position: absolute; white-space: nowrap;
    font: 700 clamp(17px, 5.2vw, 23px) 'Courier New', monospace;
    color: rgba(150, 214, 60, 0.22);
    text-shadow: 0 0 10px rgba(166, 229, 52, 0.12);
    animation: eqDrift 9s ease-in-out infinite;
  }
  @keyframes eqDrift {
    0%, 100% { transform: translateX(0); opacity: .55; }
    50%      { transform: translateX(-16px); opacity: 1; }
  }

  /* moléculas decorativas nos cantos */
  .molec { position: absolute; z-index: 0; stroke: rgba(166,229,52,.20); fill: none; stroke-width: 2.5; }

  /* conteúdo acima do fundo */
  #cover > .capa-conteudo { position: relative; z-index: 2; display: contents; }

  /* ondas de áudio + frasco */
  .topo { position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: center; height: 120px; margin-bottom: 30px; }
  .ondas { position: absolute; bottom: 26px; display: flex; align-items: center; gap: 4px; z-index: 1; }
  .ondas span {
    width: 4px; border-radius: 3px; background: var(--acid);
    box-shadow: 0 0 8px var(--acid-glow);
    animation: onda 1.1s ease-in-out infinite;
  }
  @keyframes onda { 0%,100% { height: 8px; opacity:.45; } 50% { height: 40px; opacity: .95; } }

  .frasco { width: clamp(74px, 20vw, 92px); position: relative; z-index: 2; overflow: visible;
    filter: drop-shadow(0 0 8px rgba(166,229,52,.55)); }
  .bolha { animation: subirBolha 2.8s ease-in infinite; opacity: 0; }
  .bolha.b2 { animation-delay: .9s; }
  .bolha.b3 { animation-delay: 1.8s; }
  @keyframes subirBolha {
    0%   { transform: translateY(0);     opacity: 0; }
    15%  { opacity: .9; }
    85%  { opacity: .6; }
    100% { transform: translateY(-30px); opacity: 0; }
  }

  .credito {
    position: relative; z-index: 2;
    margin: 18px 0 0; font-size: clamp(12px, 3.4vw, 14px); font-weight: 600;
    letter-spacing: .5px; color: #cfe8a8; opacity: .8;
  }
  .titulo {
    position: relative; z-index: 2;
    margin: 0; font-size: clamp(26px, 7.6vw, 40px); line-height: 1.05;
    font-weight: 800; letter-spacing: .5px; color: #f2fbe4;
    text-shadow: 0 0 18px rgba(255,255,255,.12);
  }
  .subtema {
    position: relative; z-index: 2;
    margin: 2px 0 0; font-size: clamp(52px, 17vw, 96px); line-height: 1;
    font-weight: 900; letter-spacing: 2px; color: var(--acid);
    text-shadow: 0 0 12px var(--acid-glow), 0 0 34px var(--acid-glow), 0 0 60px rgba(166,229,52,.35);
    animation: pulsarNeon 3s ease-in-out infinite;
  }
  @keyframes pulsarNeon {
    0%,100% { text-shadow: 0 0 12px var(--acid-glow), 0 0 30px var(--acid-glow), 0 0 55px rgba(166,229,52,.3); }
    50%     { text-shadow: 0 0 16px var(--acid-glow), 0 0 44px var(--acid-glow), 0 0 78px rgba(166,229,52,.5); }
  }
  .lema {
    position: relative; z-index: 2;
    margin: 6px 0 0; font-size: clamp(15px, 4.4vw, 20px); font-style: italic;
    color: #dceec0; opacity: .9;
  }
  #btnIniciar {
    position: relative; z-index: 2;
    margin-top: 42px; padding: 17px 74px; border: none; border-radius: 999px;
    background: linear-gradient(145deg, #baf34f, var(--acid-2));
    color: #0a1a06; font-size: 22px; font-weight: 800; letter-spacing: 3px;
    cursor: pointer; box-shadow: 0 0 26px var(--acid-glow), 0 8px 20px rgba(0,0,0,.4);
    transition: transform .15s;
  }
  #btnIniciar:active { transform: scale(.95); }

  /* ---------- Botão Home ---------- */
  #homeBtn {
    position: fixed; top: 14px; right: 14px; z-index: 60;
    display: flex; align-items: center; gap: 7px;
    background: var(--painel); color: var(--acid);
    border: 1px solid rgba(166, 229, 52, 0.45); border-radius: 999px;
    padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  #homeBtn svg { width: 17px; height: 17px; fill: var(--acid); }

  /* ---------- Botão Play ---------- */
  #playBtn {
    position: fixed; right: 18px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 60;
    width: 53px; height: 53px; border-radius: 50%; border: none;
    background: linear-gradient(145deg, #b4f04a, var(--acid-2));
    box-shadow: 0 6px 18px var(--acid-glow);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .15s;
  }
  #playBtn:active { transform: scale(.92); }
  #playBtn > svg:not(#playRing) { width: 24px; height: 24px; fill: #0a1a06; }
  /* anel que marca o tempo da narração ao redor do play */
  #playRing {
    position: absolute; left: 50%; top: 50%; width: 66px; height: 66px;
    transform: translate(-50%, -50%) rotate(-90deg); pointer-events: none; overflow: visible;
  }
  #playRing circle { fill: none; stroke-width: 4; }
  #playRing .track { stroke: rgba(255, 255, 255, .18); }
  #playRing .prog {
    stroke: #eaffcf; stroke-linecap: round;
    stroke-dasharray: 232.5; stroke-dashoffset: 232.5;
    transition: stroke-dashoffset .18s linear;
    filter: drop-shadow(0 0 3px rgba(234, 255, 207, .5));
  }

  /* ---------- Navegação rápida ---------- */
  #quickNav {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 61; max-width: 74vw;
    background: var(--painel); color: var(--texto);
    border: 1px solid rgba(166, 229, 52, 0.4); border-radius: 999px;
    padding: 11px 22px; white-space: nowrap;
    text-align: center; font: 700 13.5px system-ui, sans-serif;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
  }
  #quickNav .seta { color: var(--acid); margin-right: 8px; }

  #sheetOverlay {
    position: fixed; inset: 0; z-index: 69;
    background: rgba(4, 10, 4, 0.55);
  }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
    background: #0d2110; color: var(--texto);
    border-top: 2px solid var(--acid); border-radius: 20px 20px 0 0;
    max-height: 72vh; display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform .35s ease;
    font-family: system-ui, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #sheet.open { transform: translateY(0); }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 10px; border-bottom: 1px solid rgba(166,229,52,.22);
  }
  .sheet-head span { font-size: 17px; font-weight: 800; color: var(--acid); letter-spacing: 1px; }
  #sheetClose {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(166,229,52,.45);
    background: transparent; color: var(--acid); font-size: 16px; cursor: pointer;
  }
  #sheetList {
    margin: 0; padding: 6px 18px 18px 40px; overflow-y: auto;
  }
  #sheetList li {
    padding: 13px 10px; font-size: 15px; cursor: pointer;
    border-bottom: 1px solid rgba(166, 229, 52, 0.12);
  }
  #sheetList li::marker { color: var(--acid); font-weight: 800; }
  #sheetList li.ativa { color: var(--acid); font-weight: 800; }
  #sheetList li:active { background: rgba(166, 229, 52, 0.1); }

  /* ---------- Selo de versão ---------- */
  #versao {
    position: fixed; left: 10px; bottom: 8px; z-index: 105;
    font: 600 11px system-ui, sans-serif; color: rgba(166, 229, 52, 0.6);
    letter-spacing: .5px; pointer-events: none; user-select: none;
    text-shadow: 0 0 6px rgba(0, 0, 0, .6);
  }

  /* ---------- Camada de textos das narrações ---------- */
  #storyLayer { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
  #stTop {
    position: absolute; top: 12%; left: 0; right: 0; text-align: center; padding: 0 20px;
  }
  #stCenter {
    position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 24px;
  }
  #stBottom {
    position: absolute; bottom: calc(13% + 1.6rem); left: 0; right: 0; text-align: center; padding: 0 24px;
  }
  .st-item {
    font-family: system-ui, sans-serif; color: #f2fbe4; font-weight: 800;
    font-size: clamp(30px, 8.5vw, 48px); line-height: 1.12; text-align: center;
    text-shadow: 0 2px 16px rgba(0, 0, 0, .65), 0 0 26px rgba(166, 229, 52, .22);
    animation: stIn .7s cubic-bezier(.18, .9, .24, 1.35) both;
  }
  .st-credito { font-size: clamp(20px, 5.6vw, 30px); font-weight: 700; color: #dceec0; }
  .st-grande {
    font-size: clamp(56px, 17vw, 104px); font-weight: 900; letter-spacing: 2px;
    color: var(--acid); text-shadow: 0 0 16px var(--acid-glow), 0 0 44px var(--acid-glow);
  }
  .st-medio { font-size: clamp(30px, 9vw, 54px); color: #eaf7d9; }
  .st-lista {
    width: min(82vw, 460px); text-align: left;
    font-size: clamp(23px, 6.6vw, 38px); font-weight: 700;
  }
  .st-lista b { color: var(--acid); }
  .st-parte {
    font-size: clamp(18px, 5vw, 26px); font-weight: 800; letter-spacing: 3px;
    text-transform: uppercase; color: var(--acid); text-shadow: 0 0 14px var(--acid-glow);
  }
  .st-pergunta { font-size: clamp(26px, 7.2vw, 42px); line-height: 1.18; }
  .st-pergunta .maior {
    display: inline-block; font-size: 1.5em; font-weight: 900;
    color: var(--acid); text-shadow: 0 0 16px var(--acid-glow);
  }
  .st-titulo2 {
    font-size: clamp(30px, 8.5vw, 50px); font-weight: 900;
    color: var(--acid); text-shadow: 0 0 16px var(--acid-glow);
  }
  /* mesmo tamanho de "Vamos começar?", porém em branco */
  .st-branco {
    color: #f2fbe4;
    text-shadow: 0 2px 16px rgba(0, 0, 0, .65), 0 0 26px rgba(166, 229, 52, .22);
  }
  /* sobe o texto ~1,5 linha em relação ao centro */
  .st-sobe { position: relative; top: -2.6rem; }
  /* trecho destacado que pulsa dentro de uma frase */
  .dest { display: inline-block; }
  .dest.pulsar { animation: destPulsa .6s ease-in-out 2; }
  @keyframes destPulsa {
    0%, 100% { color: #f2fbe4; transform: scale(1);    text-shadow: 0 2px 16px rgba(0, 0, 0, .65); }
    50%      { color: #ffb27a; transform: scale(1.18); text-shadow: 0 0 18px rgba(207, 106, 47, .95); }
  }
  .st-desc {
    font-size: clamp(19px, 5.2vw, 28px); font-weight: 600;
    color: #eaf7d9; max-width: 88vw; line-height: 1.3;
  }
  .st-ano {
    font-size: clamp(26px, 7.5vw, 44px); font-weight: 800; color: #f2fbe4;
    text-shadow: 0 2px 16px rgba(0, 0, 0, .6);
  }

  /* ---------- Imagem das narrações (pan arrastável com o dedo) ---------- */
  #panImg {
    position: fixed; top: 0; left: 0; height: 100vh; width: auto; max-width: none;
    z-index: 38; opacity: 0; transition: opacity .5s ease;
    pointer-events: none; touch-action: none; will-change: transform;
    user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
    transform: translateX(0);
  }
  #panImg.show { opacity: 1; pointer-events: auto; cursor: grab; }
  #panImg.grabbing { cursor: grabbing; }

  /* ---------- Prateleira das substâncias inorgânicas (dialogo1.1) ---------- */
  #shelfInorg {
    position: fixed; inset: 0; z-index: 38;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .6s ease;
  }
  #shelfInorg.show { opacity: 1; }
  #shelfInorg svg { width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 14px 34px rgba(0,0,0,.55));
    transform: translateZ(0); backface-visibility: hidden; }

  /* a estante desliza de baixo (empurra o título) e depois dá zoom nos ácidos */
  #shelfInorg .pr-scene {
    transform-box: fill-box; transform-origin: center;
    transform: translate(0px, 1160px) scale(.85);
    transition: transform 3s cubic-bezier(.35, 0, .2, 1);
    will-change: transform; backface-visibility: hidden;
  }
  #shelfInorg.pousada .pr-scene { transform: translate(0px, 0px) scale(.85); }
  #shelfInorg.zoom .pr-scene {
    transform: translate(0px, 492px) scale(1.75);
    transition: transform 1.5s cubic-bezier(.4, 0, .2, 1);
  }
  /* cada prateleira enche junto com sua etiqueta e o "Grupo N" (uma por vez) */
  #shelfInorg .pr-frascos { opacity: 0; transition: opacity .7s ease; }
  #shelfInorg .pr-tag, #shelfInorg .pr-grupo {
    opacity: 0; transform: scale(.6); transform-box: fill-box; transform-origin: center;
    transition: opacity .5s ease, transform .55s cubic-bezier(.2, .9, .25, 1.4);
  }
  #shelfInorg.tier0-on .pr-frascos-0,
  #shelfInorg.tier1-on .pr-frascos-1,
  #shelfInorg.tier2-on .pr-frascos-2,
  #shelfInorg.tier3-on .pr-frascos-3 { opacity: 1; }
  /* "Grupo 1..4" aparecem juntos no MEIO das prateleiras */
  #shelfInorg.grupos-on .pr-grupo { opacity: 1; transform: none; }
  /* categorias (Ácidos, Bases...) aparecem uma por vez no TOPO */
  #shelfInorg.tier0-on .pr-tag-0,
  #shelfInorg.tier1-on .pr-tag-1,
  #shelfInorg.tier2-on .pr-tag-2,
  #shelfInorg.tier3-on .pr-tag-3 { opacity: 1; transform: none; }
  /* ao entrar cada categoria, o "Grupo N" correspondente some ao mesmo tempo */
  #shelfInorg.tier0-on .pr-grupo-0,
  #shelfInorg.tier1-on .pr-grupo-1,
  #shelfInorg.tier2-on .pr-grupo-2,
  #shelfInorg.tier3-on .pr-grupo-3 { opacity: 0; transform: scale(.6); }
  /* zoom nos ácidos: escurece o resto e destaca a 1ª prateleira */
  #shelfInorg .pr-dim   { opacity: 0; transition: opacity 1.2s ease; }
  #shelfInorg.zoom .pr-dim   { opacity: .66; }
  #shelfInorg .pr-focus { opacity: 0; transition: opacity 1.2s ease; }
  #shelfInorg.zoom .pr-focus { opacity: 1; }

  /* Título "Substâncias Inorgânicas" que persiste e sobe encolhendo no dialogo1.1 */
  #substTitle {
    position: fixed; left: 0; right: 0; top: 50%; z-index: 42;
    text-align: center; padding: 0 24px;
    font-family: system-ui, sans-serif; font-weight: 900; line-height: 1.12;
    font-size: clamp(30px, 8.5vw, 50px);
    color: var(--acid); text-shadow: 0 0 16px var(--acid-glow);
    transform: translateY(-50%) scale(1); transform-origin: center center;
    opacity: 0; pointer-events: none;
    transition: top 3s cubic-bezier(.35, 0, .2, 1),
                transform 3s cubic-bezier(.35, 0, .2, 1),
                opacity .5s ease;
  }
  #substTitle.show { opacity: 1; }
  #substTitle.topo { top: 6%; transform: translateY(-50%) scale(.5); }

  /* ---------- Cena do dialogo1.1A ---------- */
  #cena11a { position: fixed; inset: 0; z-index: 41; pointer-events: none; }
  /* saída dramática (some tudo de uma categoria ao entrar na próxima) */
  #cena11a.saindo, #cena11b.saindo, #cena11c.saindo {
    transition: transform .55s cubic-bezier(.5, 0, .75, 0), filter .55s ease, opacity .55s ease;
    transform: scale(1.4); filter: blur(9px); opacity: 0;
  }
  /* "Ácidos" com o mesmo brilho da capa */
  .c11a-acidos {
    position: absolute; top: 14%; left: 0; right: 0; text-align: center;
    font-family: system-ui, sans-serif; font-weight: 900; letter-spacing: 1px;
    font-size: clamp(40px, 13vw, 76px); color: var(--acid);
    opacity: 0; transform: translateY(24px) scale(.9);
    transition: opacity .6s ease, transform .6s cubic-bezier(.2, .9, .25, 1.35);
    animation: pulsarNeon 3s ease-in-out infinite;
  }
  .c11a-acidos.show { opacity: 1; transform: none; }
  /* ---------- Cena do dialogo1.1B (Bases): "Bases" em rosa, mesma fonte/brilho ---------- */
  #cena11b { position: fixed; inset: 0; z-index: 41; pointer-events: none; }
  .c11b-titulo {
    position: absolute; top: 14%; left: 0; right: 0; text-align: center;
    font-family: system-ui, sans-serif; font-weight: 900; letter-spacing: 1px;
    font-size: clamp(40px, 13vw, 76px); color: var(--rosa);
    opacity: 0; transform: translateY(24px) scale(.9);
    transition: opacity .6s ease, transform .6s cubic-bezier(.2, .9, .25, 1.35);
    animation: pulsarNeonRosa 3s ease-in-out infinite;
  }
  .c11b-titulo.show { opacity: 1; transform: none; }
  @keyframes pulsarNeonRosa {
    0%,100% { text-shadow: 0 0 12px var(--rosa-glow), 0 0 30px var(--rosa-glow), 0 0 55px rgba(255,93,177,.3); }
    50%     { text-shadow: 0 0 16px var(--rosa-glow), 0 0 44px var(--rosa-glow), 0 0 78px rgba(255,93,177,.5); }
  }
  /* ---------- Cena do dialogo1.1C (Óxidos): "Óxidos" marrom ferrugem ---------- */
  #cena11c { position: fixed; inset: 0; z-index: 41; pointer-events: none; }
  .c11c-titulo {
    position: absolute; top: 14%; left: 0; right: 0; text-align: center;
    font-family: system-ui, sans-serif; font-weight: 900; letter-spacing: 1px;
    font-size: clamp(40px, 13vw, 76px); color: var(--ferrugem);
    opacity: 0; transform: translateY(24px) scale(.9);
    transition: opacity .6s ease, transform .6s cubic-bezier(.2, .9, .25, 1.35);
    animation: pulsarNeonFerrugem 3s ease-in-out infinite;
  }
  .c11c-titulo.show { opacity: 1; transform: none; }
  @keyframes pulsarNeonFerrugem {
    0%,100% { text-shadow: 0 0 12px var(--ferrugem-glow), 0 0 30px var(--ferrugem-glow), 0 0 55px rgba(207,106,47,.3); }
    50%     { text-shadow: 0 0 16px var(--ferrugem-glow), 0 0 44px var(--ferrugem-glow), 0 0 78px rgba(207,106,47,.5); }
  }
  /* não-ácidos (H2O, H2O2) lado a lado */
  .c11a-nao {
    position: absolute; top: 31%; left: 0; right: 0;
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 40px;
    font-family: 'Courier New', monospace; font-weight: 800;
  }
  .c11a-nao > div {
    font-size: clamp(26px, 8vw, 44px); color: #eaf7d9; white-space: nowrap;
    opacity: 0; transform: translateX(-22px);
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .9, .25, 1.3);
  }
  .c11a-nao > div.show { opacity: 1; transform: none; }
  .c11a-nao sub { font-size: .62em; }
  .c11a-h2o, .c11a-h2o2 {
    color: #ff4141;
    text-shadow: 0 0 10px rgba(255, 60, 60, .85), 0 0 24px rgba(255, 30, 30, .6);
  }
  .c11a-h2o2 .aviso { margin-left: 10px; -webkit-text-fill-color: initial; }
  /* frascos das cenas (ácidos, bases, óxidos, ...) — subidos na altura dos quadrados de fundo */
  .c11a-frascos, .c11b-frascos, .c11c-frascos {
    position: absolute; left: 0; right: 0; bottom: calc(12% + 2.3rem);
    opacity: 0; transform: translateY(34px);

  .c11a-frascos.show, .c11b-frascos.show, .c11c-frascos.show { opacity: 1; transform: none; }

  /* descrição logo abaixo do título (não empurra o título -> 1->1.1 seamless) */

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a160a);
scene.fog = new THREE.Fog(0x0a160a, 30, 70);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- Iluminação (estilo cartoon suave) ----------
scene.add(new THREE.HemisphereLight(0xd6f0a8, 0x18240f, 0.9));
const key = new THREE.DirectionalLight(0xf4ffe0, 1.1);
key.position.set(8, 14, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -15; key.shadow.camera.right = 15;
key.shadow.camera.top = 15; key.shadow.camera.bottom = -15;
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ad85a, 0.4);
fill.position.set(-10, 6, -8);
scene.add(fill);

// ---------- Materiais toon ----------
function toonMat(color) {
  const c = new Uint8Array([90, 160, 230, 255]);
  const grad = new THREE.DataTexture(c, 4, 1, THREE.LuminanceFormat);
  grad.minFilter = grad.magFilter = THREE.NearestFilter;
  grad.needsUpdate = true;
  return new THREE.MeshToonMaterial({ color, gradientMap: grad });
}

// ---------- Bancada escura ----------
const bench = new THREE.Mesh(new THREE.BoxGeometry(26, 1.2, 14), toonMat(0x1d2b16));
bench.position.y = -0.6;
bench.receiveShadow = true;
scene.add(bench);

// borda da bancada (detalhe cartoon)
const edge = new THREE.Mesh(new THREE.BoxGeometry(26.4, 0.25, 14.4), toonMat(0x2b4020));
edge.position.y = 0.02;
edge.receiveShadow = true;
scene.add(edge);

// pés da bancada
const legGeo = new THREE.BoxGeometry(1, 6, 1);
[[-11.5, -6], [11.5, -6], [-11.5, 6], [11.5, 6]].forEach(([x, z]) => {
  const leg = new THREE.Mesh(legGeo, toonMat(0x152010));
  leg.position.set(x, -4.2, z);
  scene.add(leg);
});

// chão
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), toonMat(0x0f1b0b));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -7.2;
floor.receiveShadow = true;
scene.add(floor);

// parede de fundo
const wall = new THREE.Mesh(new THREE.PlaneGeometry(120, 60), toonMat(0x0e1c0b));
wall.position.set(0, 20, -28);
scene.add(wall);

// azulejos decorativos na parede (linha cartoon)
const tileMat = toonMat(0x172810);
for (let i = -5; i <= 5; i++) {
  const tile = new THREE.Mesh(new THREE.BoxGeometry(3.4, 3.4, 0.1), tileMat);
  tile.position.set(i * 3.8, 6, -27.9);
  scene.add(tile);
}

// ---------- Vidro e líquidos ----------
const glassMat = new THREE.MeshPhongMaterial({
  color: 0xcfe8ff, transparent: true, opacity: 0.22,
  shininess: 120, specular: 0xffffff, side: THREE.DoubleSide, depthWrite: false
});

function makeBeaker(radius, height, liquidColor, liquidLevel, liquidOpacity = 0.65) {
  const g = new THREE.Group();

  const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 0.96, height, 40, 1, true), glassMat);
  body.position.y = height / 2;
  g.add(body);

  const bottom = new THREE.Mesh(new THREE.CircleGeometry(radius * 0.96, 40), glassMat);
  bottom.rotation.x = -Math.PI / 2;
  bottom.position.y = 0.02;
  g.add(bottom);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.05, 10, 40),
    new THREE.MeshPhongMaterial({ color: 0xe8f4ff, transparent: true, opacity: 0.5, shininess: 150 }));
  rim.rotation.x = Math.PI / 2;
  rim.position.y = height;
  g.add(rim);

  if (liquidColor !== null) {
    const lh = height * liquidLevel;
    const liquid = new THREE.Mesh(
      new THREE.CylinderGeometry(radius * 0.9, radius * 0.88, lh, 40),
      new THREE.MeshPhongMaterial({ color: liquidColor, transparent: true, opacity: liquidOpacity, shininess: 90 })
    );
    liquid.position.y = lh / 2 + 0.05;
    g.add(liquid);

    const surf = new THREE.Mesh(new THREE.CircleGeometry(radius * 0.9, 40),
      new THREE.MeshPhongMaterial({ color: liquidColor, transparent: true, opacity: Math.min(liquidOpacity + 0.2, 0.85), shininess: 100 }));
    surf.rotation.x = -Math.PI / 2;
    surf.position.y = lh + 0.06;
    g.add(surf);
  }
  return g;
}

// ---------- Etiquetas com subscrito ----------
function labelTexture(parts) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 150;
  const ctx = cv.getContext('2d');

  // etiqueta branca com borda
  ctx.fillStyle = '#fdfbf4';
  roundRect(ctx, 8, 8, 240, 134, 14);
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#3a4258';
  roundRect(ctx, 8, 8, 240, 134, 14);
  ctx.stroke();
  // linha decorativa
  ctx.strokeStyle = '#c9503e';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(28, 118); ctx.lineTo(228, 118); ctx.stroke();

  const main = 58, sub = 36;
  ctx.fillStyle = '#232936';
  ctx.textBaseline = 'alphabetic';

  let total = 0;
  parts.forEach(p => {
    ctx.font = (p.sub ? sub : main) + 'px Verdana, sans-serif';
    total += ctx.measureText(p.t).width;
  });

  let x = (256 - total) / 2;
  const baseY = 88;
  parts.forEach(p => {
    ctx.font = (p.sub ? sub : main) + 'px Verdana, sans-serif';
    ctx.fillText(p.t, x, p.sub ? baseY + 14 : baseY);
    x += ctx.measureText(p.t).width;
  });

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 8;
  return tex;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function addLabel(group, parts, radius, height) {
  const tex = labelTexture(parts);
  const w = radius * 1.7, h = w * 0.6;
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  plane.position.set(0, height * 0.5, radius + 0.03);
  group.add(plane);
}

// ---------- Béquer principal com água ----------
const waterBeaker = makeBeaker(1.6, 3.4, 0x4aa8e8, 0.62);
waterBeaker.position.set(-3.5, 0.3, 1.5);
waterBeaker.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(waterBeaker);

// ---------- 3 béqueres com etiquetas ----------
const reagents = [
  { name: 'HCl', parts: [{ t: 'HCl' }], pos: [1.8, 0.3, 1.5] },
  { name: 'H₂S', parts: [{ t: 'H' }, { t: '2', sub: true }, { t: 'S' }], pos: [4.6, 0.3, 1.5] },
  { name: 'H₃PO₄', parts: [{ t: 'H' }, { t: '3', sub: true }, { t: 'PO' }, { t: '4', sub: true }], pos: [7.4, 0.3, 1.5] },
];

reagents.forEach(r => {
  const b = makeBeaker(1.1, 2.6, 0xe6f2fa, 0.5, 0.14);
  addLabel(b, r.parts, 1.1, 2.6);
  b.position.set(...r.pos);
  b.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(b);
});

// sombra fake suave sob os béqueres (cartoon)
function softShadow(x, z, r) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 32),
    new THREE.MeshBasicMaterial({ color: 0x0b0e15, transparent: true, opacity: 0.35 }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.31, z);
  scene.add(m);
}
softShadow(-3.5, 1.5, 2.0);
reagents.forEach(r => softShadow(r.pos[0], r.pos[2], 1.4));

// ---------- Pipeta ----------
const PLANE_Z = 1.5;
const pipette = new THREE.Group();
const pipBody = new THREE.Group();
pipette.add(pipBody);

const pipGlass = new THREE.MeshPhongMaterial({
  color: 0xd8ecff, transparent: true, opacity: 0.35,
  shininess: 140, specular: 0xffffff, depthWrite: false
});

const tipMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.01, 1.0, 20), pipGlass);
tipMesh.position.y = 0.5;
pipBody.add(tipMesh);

const tubeMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.0, 20), pipGlass);
tubeMesh.position.y = 2.0;
pipBody.add(tubeMesh);

const bulbMesh = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 20), pipGlass);
bulbMesh.scale.set(1, 1.25, 1);
bulbMesh.position.y = 3.35;
bulbMesh.castShadow = true;
pipBody.add(bulbMesh);

// líquido dentro da pipeta (cresce de baixo pra cima)
const pipLiquidGeo = new THREE.CylinderGeometry(0.065, 0.065, 1.9, 16);
pipLiquidGeo.translate(0, 0.95, 0);
const pipLiquid = new THREE.Mesh(pipLiquidGeo,
  new THREE.MeshPhongMaterial({ color: 0xbfe3f2, transparent: true, opacity: 0.6, shininess: 100 }));
pipLiquid.position.y = 1.02;
pipLiquid.scale.y = 0.0001;
pipBody.add(pipLiquid);

// áreas de toque invisíveis (maiores, pra facilitar no dedo)
const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
const hitTip = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.3, 8), hitMat.clone());
hitTip.position.y = 0.55; hitTip.name = 'tip';
pipBody.add(hitTip);
const hitTube = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2.0, 8), hitMat.clone());
hitTube.position.y = 2.0; hitTube.name = 'tube';
pipBody.add(hitTube);
const hitBulb = new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 10), hitMat.clone());
hitBulb.position.y = 3.35; hitBulb.name = 'bulb';
pipBody.add(hitBulb);

pipette.position.set(1.8, 3.3, PLANE_Z); // flutuando acima do HCl
scene.add(pipette);

// estado da pipeta
let pipFill = 0, pipTargetFill = 0;
let sucking = false;
let squeezeTime = -10;
const ACID_SURF = 0.3 + 2.6 * 0.5 + 0.06;
const WATER_SURF = 0.3 + 3.4 * 0.62 + 0.06;

function tipContainer() {
  const x = pipette.position.x, y = pipette.position.y;
  if (Math.abs(x - (-3.5)) < 1.35 && y < WATER_SURF - 0.05) return { name: 'água', color: 0x4aa8e8 };
  for (const r of reagents) {
    if (Math.abs(x - r.pos[0]) < 0.85 && y < ACID_SURF - 0.05) return { name: r.name, color: 0xdcedf7 };
  }
  return null;
}

// gotas
const drops = [];
function spawnDrop() {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8),
    new THREE.MeshPhongMaterial({ color: pipLiquid.material.color.getHex(), transparent: true, opacity: 0.85, shininess: 120 }));
  d.position.set(pipette.position.x, pipette.position.y - 0.02, PLANE_Z);
  scene.add(d);
  drops.push({ mesh: d, vy: 0 });
}
function dropFloorY(x) {
  if (Math.abs(x - (-3.5)) < 1.4) return WATER_SURF; // água
  for (const r of reagents) if (Math.abs(x - r.pos[0]) < 0.95) return ACID_SURF;
  return 0.36; // bancada
}

// arraste da pipeta (restrito ao plano dos vidros)
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -PLANE_Z);
const planePoint = new THREE.Vector3();
const LIMITS = { minX: -8.5, maxX: 11, minY: 0.42, maxY: 7.5 };
let pipDrag = null;

function raycastPipette(e) {
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects([hitTip, hitTube, hitBulb]);
  if (hits.length) return hits[0].object.name;

  // fallback: proximidade na tela (facilita pegar no celular)
  const pts = [['tip', 0.4], ['tube', 2.0], ['bulb', 3.35]];
  const v = new THREE.Vector3();
  let best = null, bestD = 60;
  for (const [name, off] of pts) {
    v.set(pipette.position.x, pipette.position.y + off, PLANE_Z).project(camera);
    const sx = (v.x + 1) / 2 * innerWidth, sy = (-v.y + 1) / 2 * innerHeight;
    const d = Math.hypot(e.clientX - sx, e.clientY - sy);
    if (d < bestD) { bestD = d; best = name; }
  }
  return best;
}

function startBulbPress(drag) {
  if (pipFill > 0.1) {
    drag.action = 'expel';
  } else {
    const c = tipContainer();
    if (c) {
      sucking = true;
      pipLiquid.material.color.setHex(c.color);
      squeezeTime = clock.getElapsedTime();
      showMsg('Sugando ' + c.name + '... (segure)');
      drag.action = 'suck';
    } else {
      drag.action = 'needliquid';
    }
  }
}

function endBulbPress(drag) {
  sucking = false;
  if (drag.action === 'suck') {
    pipTargetFill = pipFill;
    if (pipFill > 0.05) showMsg('Pipeta com ' + Math.round(pipFill * 100) + '% de líquido');
    return;
  }
  if (drag.moved) return;
  if (drag.action === 'expel') {
    pipTargetFill = 0;
    squeezeTime = clock.getElapsedTime();
    showMsg('Soltando o líquido...');
  } else if (drag.action === 'needliquid') {
    showMsg('Mergulhe a ponta num líquido primeiro');
  }
}

// ---------- Controles de câmera ----------
// Câmera padrão de entrada (enquadramento de fundo do audiobook)
const target = new THREE.Vector3(0.32, 10.93, 0.42);
let theta = -0.012, phi = 1.534, dist = 9.03;
const MIN_D = 5, MAX_D = 40;
let camLocked = true;  // câmera travada por padrão; tecla L libera/trava

function updateCamera() {
  phi = Math.max(0.15, Math.min(Math.PI / 2 - 0.02, phi));
  dist = Math.max(MIN_D, Math.min(MAX_D, dist));
  camera.position.set(
    target.x + dist * Math.sin(phi) * Math.sin(theta),
    target.y + dist * Math.cos(phi),
    target.z + dist * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(target);
}
updateCamera();

const pointers = new Map();
let lastPinch = 0, lastMid = null, lastAngle = null;

renderer.domElement.addEventListener('pointerdown', e => {
  renderer.domElement.setPointerCapture(e.pointerId);
  hideHint();

  if (!pipDrag) {
    const part = raycastPipette(e);
    if (part) {
      raycaster.ray.intersectPlane(dragPlane, planePoint);
      pipDrag = {
        id: e.pointerId, part, moved: false, action: null,
        startX: e.clientX, startY: e.clientY,
        offX: planePoint.x - pipette.position.x,
        offY: planePoint.y - pipette.position.y
      };
      if (part === 'bulb' || part === 'tip') startBulbPress(pipDrag);
      return;
    }
  } else {
    return; // segurando a pipeta: ignora outros toques
  }

  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button, shift: e.shiftKey });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    lastPinch = Math.hypot(a.x - b.x, a.y - b.y);
    lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    lastAngle = Math.atan2(b.y - a.y, b.x - a.x);
  }
});

renderer.domElement.addEventListener('pointermove', e => {
  if (pipDrag && e.pointerId === pipDrag.id) {
    if (Math.hypot(e.clientX - pipDrag.startX, e.clientY - pipDrag.startY) > 10) pipDrag.moved = true;
    ndc.x = (e.clientX / innerWidth) * 2 - 1;
    ndc.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(dragPlane, planePoint)) {
      pipette.position.x = Math.max(LIMITS.minX, Math.min(LIMITS.maxX, planePoint.x - pipDrag.offX));
      pipette.position.y = Math.max(LIMITS.minY, Math.min(LIMITS.maxY, planePoint.y - pipDrag.offY));
      pipette.position.z = PLANE_Z;
    }
    return;
  }

  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { ...prev, x: e.clientX, y: e.clientY });

  if (camLocked) return;  // câmera travada: ignora movimento

  if (pointers.size === 1) {
    if (prev.button === 2 || prev.shift) {
      pan(dx, dy);
      updateCamera();
    } else if (e.pointerType === 'mouse') {
      theta -= dx * 0.006;
      phi -= dy * 0.006;
      updateCamera();
    }
    // toque com 1 dedo não move a câmera (reservado pra pipeta)
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const pinch = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    if (lastPinch > 0) dist *= lastPinch / pinch;
    if (lastMid) pan(mid.x - lastMid.x, mid.y - lastMid.y);
    if (lastAngle !== null) {
      let da = ang - lastAngle;
      if (da > Math.PI) da -= 2 * Math.PI;
      if (da < -Math.PI) da += 2 * Math.PI;
      theta += da;
    }
    lastPinch = pinch;
    lastMid = mid;
    lastAngle = ang;
    updateCamera();
  }
});

function endPointer(e) {
  if (pipDrag && e.pointerId === pipDrag.id) {
    if (pipDrag.part === 'bulb' || pipDrag.part === 'tip') endBulbPress(pipDrag);
    pipDrag = null;
    return;
  }
  pointers.delete(e.pointerId);
  if (pointers.size < 2) { lastPinch = 0; lastMid = null; lastAngle = null; }
}
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', endPointer);
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

function pan(dx, dy) {
  const factor = dist * 0.0016;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
  target.addScaledVector(right, -dx * factor);
  target.addScaledVector(up, dy * factor);
}

renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  if (camLocked) return;  // câmera travada: ignora zoom
  dist *= e.deltaY > 0 ? 1.08 : 0.93;
  updateCamera();
}, { passive: false });

let hintHidden = false;
const hintEl = document.getElementById('hint');
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  setTimeout(() => { hintEl.style.opacity = '0'; }, 2500);
}
let msgTimer;
function showMsg(text) {
  hintEl.textContent = text;
  hintEl.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { hintEl.style.opacity = '0'; }, 2200);
}

// ---------- Animação ----------
const clock = new THREE.Clock();
let lastT = 0;
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(t - lastT, 0.05);
  lastT = t;

  waterBeaker.children.forEach(c => {
    if (c.geometry && c.geometry.type === 'CircleGeometry' && c.material.opacity > 0.7) {
      c.position.y = 3.4 * 0.62 + 0.06 + Math.sin(t * 2) * 0.015;
    }
  });

  // flutuação suave da pipeta (só visual, quando não está sendo arrastada)
  pipBody.position.y = pipDrag ? 0 : Math.sin(t * 1.6) * 0.06;

  // sucção enquanto segura a pêra (ponta precisa estar submersa)
  if (sucking) {
    if (tipContainer() && pipFill < 1) {
      const before = pipFill;
      pipFill = Math.min(1, pipFill + dt * 0.55);
      pipTargetFill = pipFill;
      if (pipFill >= 1 && before < 1) showMsg('Pipeta cheia!');
    }
  }

  // enchimento / esvaziamento do líquido da pipeta
  const wasExpelling = pipTargetFill < pipFill - 0.01;
  if (pipFill > pipTargetFill) pipFill = Math.max(pipTargetFill, pipFill - dt * 0.9);
  pipLiquid.scale.y = Math.max(pipFill, 0.0001);

  // gotas caindo enquanto esvazia
  if (wasExpelling && Math.floor(t * 12) !== Math.floor((t - dt) * 12)) spawnDrop();

  // aperto da pêra (animação de squash)
  const sq = Math.max(0, 1 - (t - squeezeTime) * 3);
  const squash = 1 - 0.25 * Math.sin(sq * Math.PI);
  bulbMesh.scale.set(1 + (1 - squash) * 0.6, 1.25 * squash, 1 + (1 - squash) * 0.6);

  // física das gotas
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.vy -= 9.8 * dt;
    d.mesh.position.y += d.vy * dt;
    if (d.mesh.position.y <= dropFloorY(d.mesh.position.x)) {
      scene.remove(d.mesh);
      drops.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Tecla C: coordenadas da câmera ----------
// Mostra theta/phi/dist/target atuais e copia um trecho pronto para usar
// nos EVENTOS (função irParaCamera). Aperte C de novo para fechar.
function snapshotCamera() {
  return {
    theta: +theta.toFixed(3), phi: +phi.toFixed(3), dist: +dist.toFixed(2),
    target: [+target.x.toFixed(2), +target.y.toFixed(2), +target.z.toFixed(2)]
  };
}
function trechoCamera(s) {
  return `irParaCamera({ theta: ${s.theta}, phi: ${s.phi}, dist: ${s.dist}, target: [${s.target.join(', ')}] });`;
}
function copiar(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).catch(() => {});
  } else {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
}
const camBox = document.getElementById('camCoords');
function mostrarCoordenadas() {
  const s = snapshotCamera();
  const trecho = trechoCamera(s);
  camBox.innerHTML =
    '<span class="tit">📷 Câmera</span>\n' +
    'theta:  ' + s.theta.toFixed(3) + '\n' +
    'phi:    ' + s.phi.toFixed(3) + '\n' +
    'dist:   ' + s.dist.toFixed(2) + '\n' +
    'target: ' + s.target.join(', ') + '\n\n' +
    '<span class="snip">' + trecho + '</span>\n' +
    '<span class="rodape">copiado! — clique para copiar de novo · C fecha</span>';
  camBox.hidden = false;
  camBox.dataset.trecho = trecho;
  copiar(trecho);
}
addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') {
    if (!camBox.hidden) camBox.hidden = true;
    else mostrarCoordenadas();
  }
  if (e.key === 'l' || e.key === 'L') {
    camLocked = !camLocked;
    showMsg(camLocked ? '🔒 Câmera travada' : '🔓 Câmera liberada — arraste/pinça para mover');
  }
});
camBox.addEventListener('click', () => copiar(camBox.dataset.trecho || ''));

// Move a câmera para uma posição salva (usar nos EVENTOS dos diálogos).
// suave = true anima; caso contrário, salta direto.
function irParaCamera(pos, suave = true) {
  const alvo = { theta: pos.theta, phi: pos.phi, dist: pos.dist,
                 tx: pos.target[0], ty: pos.target[1], tz: pos.target[2] };
  if (!suave) {
    theta = alvo.theta; phi = alvo.phi; dist = alvo.dist;
    target.set(alvo.tx, alvo.ty, alvo.tz); updateCamera(); return;
  }
  const ini = { theta, phi, dist, tx: target.x, ty: target.y, tz: target.z };
  const t0 = performance.now(), dur = 1100;
  (function passo(now) {
    let k = Math.min(1, (now - t0) / dur);
    k = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3) / 2; // easeInOutCubic
    theta = ini.theta + (alvo.theta - ini.theta) * k;
    phi   = ini.phi   + (alvo.phi   - ini.phi)   * k;
    dist  = ini.dist  + (alvo.dist  - ini.dist)  * k;
    target.set(ini.tx + (alvo.tx-ini.tx)*k, ini.ty + (alvo.ty-ini.ty)*k, ini.tz + (alvo.tz-ini.tz)*k);
    updateCamera();
    if (k < 1) requestAnimationFrame(passo);
  })(t0);
}
</script>

const player = new Audio();
player.preload = 'auto';
let faixaAtual = -1;
let faixaTerminou = false;  // true quando a faixa acaba: próximo play toca a próxima

const $id = s => document.getElementById(s);

function tocarFaixa(i) {
  if (i < 0 || i >= FAIXAS.length) return;
  faixaAtual = i;
  faixaTerminou = false;
  const f = FAIXAS[i];
  player.src = f.arquivo;              // novo src já começa em 0 (não força currentTime antes de carregar)
  const pr = player.play();
  if (pr && pr.catch) pr.catch(() => {});
  marcarSumario();
  limparStory();
  if (typeof EVENTOS[f.id] === 'function') EVENTOS[f.id]();
}

// Botão play:
//  - 1º clique inicia o diálogo 0
//  - se a faixa terminou, toca a PRÓXIMA
//  - caso contrário, alterna play/pause da faixa atual
$id('playBtn').addEventListener('click', () => {
  if (faixaAtual < 0) { tocarFaixa(0); return; }
  if (faixaTerminou) {
    if (faixaAtual < FAIXAS.length - 1) tocarFaixa(faixaAtual + 1);
    return;
  }
  if (player.paused) player.play();
  else player.pause();
});

player.addEventListener('play',  () => setIconePlay(true));
player.addEventListener('pause', () => setIconePlay(false));

// Anel de progresso do tempo ao redor do play
const RING_C = 232.5;   // 2*pi*37
const ringProg = $id('playRingProg');
function marcarAnel(p) { ringProg.style.strokeDashoffset = RING_C * (1 - Math.max(0, Math.min(1, p || 0))); }
player.addEventListener('timeupdate', () => {
  const d = player.duration;
  marcarAnel(d && isFinite(d) ? player.currentTime / d : 0);
});
player.addEventListener('loadedmetadata', () => marcarAnel(0));   // zera ao trocar de faixa

// Ao terminar uma faixa, NÃO avança sozinho: deixa o play pronto p/ a próxima
player.addEventListener('ended', () => {
  faixaTerminou = true;
  setIconePlay(false);
  marcarAnel(1);
});

function setIconePlay(tocando) {
  $id('iconPlay').style.display  = tocando ? 'none'  : 'block';
  $id('iconPause').style.display = tocando ? 'block' : 'none';
}

// ---------- Capa / Home ----------
$id('btnIniciar').addEventListener('click', () => {
  $id('cover').classList.add('saindo');
});
$id('homeBtn').addEventListener('click', () => {
  player.pause();
  limparStory();
  $id('cover').classList.remove('saindo');
});

// ---------- Navegação rápida (sumário) ----------
const sheet = $id('sheet');
const sheetOverlay = $id('sheetOverlay');

// Sumário da navegação rápida: cada item pula para o INÍCIO de uma faixa.
// Referencia a faixa pelo 'id' (robusto a inserções na FAIXAS).
const idxFaixa = id => FAIXAS.findIndex(f => f.id === id);
const SUMARIO = [
  { titulo: 'Introdução e tutorial do app', faixa: idxFaixa('dialogo0') },
  { titulo: 'As substâncias inorgânicas',   faixa: idxFaixa('dialogo1') },
  { titulo: 'Identificando ácidos',         faixa: idxFaixa('dialogo1.1A') },
  { titulo: 'Identificando as bases',       faixa: idxFaixa('dialogo1.1B') },
  { titulo: 'Identificando óxidos',         faixa: idxFaixa('dialogo1.1C') },
];

SUMARIO.forEach(item => {
  const li = document.createElement('li');
  li.textContent = item.titulo;
  li.addEventListener('click', () => { fecharSumario(); tocarFaixa(item.faixa); });
  $id('sheetList').appendChild(li);
});

function abrirSumario()  { sheet.classList.add('open');    sheetOverlay.hidden = false; }
function fecharSumario() { sheet.classList.remove('open'); sheetOverlay.hidden = true;  }

$id('quickNav').addEventListener('click', abrirSumario);
$id('sheetClose').addEventListener('click', fecharSumario);
sheetOverlay.addEventListener('click', fecharSumario);

function marcarSumario() {
  // marca a seção cujo início (faixa) é o mais próximo abaixo da faixa atual
  let ativo = -1;
  SUMARIO.forEach((item, i) => { if (item.faixa <= faixaAtual) ativo = i; });
  [...$id('sheetList').children].forEach((li, i) => li.classList.toggle('ativa', i === ativo));
}

// ---------- Camada de textos: cenas sincronizadas ao áudio ----------
// As marcações de tempo seguem player.currentTime, então pausar o áudio
// pausa os textos, e retomar continua de onde parou.
const storyLayer = $id('storyLayer');
const stTop = $id('stTop');
const stCenter = $id('stCenter');
const stBottom = $id('stBottom');
let storyRAF = null, storyCues = [];

function stShow(onde, html, cls) {
  const el = document.createElement('div');
  el.className = 'st-item' + (cls ? ' ' + cls : '');
  el.innerHTML = html;
  const cont = onde === 'top' ? stTop : onde === 'bottom' ? stBottom : stCenter;
  cont.appendChild(el);
  return el;
}
function stSair() {  // animação dinâmica de saída + remoção
  storyLayer.querySelectorAll('.st-item').forEach(el => {
    el.style.animation = 'stOut .5s ease-in both';
    el.addEventListener('animationend', () => el.remove(), { once: true });
  });
}
function limparStory() {
  if (storyRAF) cancelAnimationFrame(storyRAF);
  storyRAF = null; storyCues = [];
  stSair();          // saída animada dos textos (não some do nada)
  esconderImagem();
  resetCena11();
  resetCena11A();
  resetCena11B();
  resetCena11C();
  resetCena12();
  tutorHand.classList.remove('show', 'tap');
  fecharSumario();
}

// ---------- Imagem das narrações (pan arrastável com o dedo) ----------
const panImgEl = $id('panImg');
let imgPanX = 0, imgMinX = 0, imgDrag = null;

function aplicarPanImg() { panImgEl.style.transform = 'translateX(' + imgPanX + 'px)'; }

function centralizarImg() {
  imgMinX = Math.min(0, innerWidth - panImgEl.offsetWidth); // <= 0 (quanto dá p/ arrastar)
  imgPanX = imgMinX / 2;                                     // entra mostrando o centro
  aplicarPanImg();
}
function mostrarImagem(src) {
  if (panImgEl.getAttribute('src') !== src) panImgEl.src = src;
  if (panImgEl.complete && panImgEl.naturalWidth) centralizarImg();
  else panImgEl.onload = centralizarImg;
  requestAnimationFrame(() => panImgEl.classList.add('show'));
}
function esconderImagem() { panImgEl.classList.remove('show'); }

// ---------- Prateleira das substâncias inorgânicas (dialogo1.1) ----------
// Estante de madeira em SVG: 4 prateleiras x 5 frascos de boticário.
// Só as vidrarias + rótulo (fórmula e nome). SEM placas de categoria e SEM fundo do lab.
const shelfEl = $id('shelfInorg');
let shelfMontada = false;

// dígitos viram subscrito (H2SO4 -> H₂SO₄); letras/parênteses ficam normais.
function subFormula(f) {
  let o = '';
  for (const ch of f) {
    o += (ch >= '0' && ch <= '9')
      ? '<tspan baseline-shift="sub" font-size="70%">' + ch + '</tspan>'
      : ch;
  }
  return o;
}

// Desenha 1 frasco. cx = centro X, by = base (onde apoia na prateleira).
function fnFrasco(cx, by, cfg, id, defs) {
  const w2 = cfg.w2 || 39, nw2 = 13, sw2 = 20, r = 9;
  const bodyTop = by - 140, shTop = by - 166, neckTop = by - 188, stTop = by - 208;
  const stroke = '#2f2116';
  const sil =
    'M' + (cx - w2) + ' ' + bodyTop + ' L' + (cx - w2) + ' ' + (by - r) +
    ' Q' + (cx - w2) + ' ' + by + ' ' + (cx - w2 + r) + ' ' + by +
    ' L' + (cx + w2 - r) + ' ' + by + ' Q' + (cx + w2) + ' ' + by + ' ' + (cx + w2) + ' ' + (by - r) +
    ' L' + (cx + w2) + ' ' + bodyTop +
    ' C' + (cx + w2) + ' ' + (bodyTop - 16) + ' ' + (cx + nw2) + ' ' + (shTop + 12) + ' ' + (cx + nw2) + ' ' + shTop +
    ' L' + (cx + nw2) + ' ' + neckTop + ' L' + (cx - nw2) + ' ' + neckTop + ' L' + (cx - nw2) + ' ' + shTop +
    ' C' + (cx - nw2) + ' ' + (shTop + 12) + ' ' + (cx - w2) + ' ' + (bodyTop - 16) + ' ' + (cx - w2) + ' ' + bodyTop + ' Z';

  const innerTop = bodyTop + 6, bodyH = by - innerTop;
  const clipId = 'bcl' + id;
  defs.push('<clipPath id="' + clipId + '"><rect x="' + (cx - w2 + 4) + '" y="' + innerTop +
    '" width="' + ((w2 - 4) * 2) + '" height="' + (by - 4 - innerTop) + '" rx="7"/></clipPath>');

  const fillTop = by - bodyH * cfg.l;
  let content = '<g clip-path="url(#' + clipId + ')">';
  content += '<rect x="' + (cx - w2) + '" y="' + fillTop + '" width="' + (w2 * 2) + '" height="' + (by - fillTop) + '" fill="' + cfg.c + '"/>';
  if (cfg.t === 'liq') {
    content += '<ellipse cx="' + cx + '" cy="' + fillTop + '" rx="' + (w2 - 6) + '" ry="6" fill="#ffffff" opacity="0.20"/>';
  } else {                       // sólido: montinho + grânulos
    content += '<ellipse cx="' + cx + '" cy="' + fillTop + '" rx="' + (w2 - 6) + '" ry="11" fill="' + cfg.c + '"/>';
    const gx = [-22, -8, 7, 20, -14, 5, 17, -4], gy = [7, 15, 5, 12, 25, 26, 20, 22];
    for (let k = 0; k < 8; k++)
      content += '<circle cx="' + (cx + gx[k]) + '" cy="' + (fillTop + gy[k]) + '" r="' + (2.4 + (k % 3 === 0 ? 1.4 : 0)) +
        '" fill="' + (k % 2 ? 'rgba(255,255,255,.32)' : 'rgba(0,0,0,.16)') + '"/>';
  }
  content += '</g>';

  const gloss = '<rect clip-path="url(#' + clipId + ')" x="' + (cx - w2 + 9) + '" y="' + (bodyTop + 10) +
    '" width="9" height="' + (bodyH * 0.5) + '" rx="4" fill="#ffffff" opacity="0.16"/>';

  const stH = (neckTop - stTop) + 8;
  const stopper = '<rect x="' + (cx - sw2) + '" y="' + stTop + '" width="' + (sw2 * 2) + '" height="' + stH +
    '" rx="6" fill="' + cfg.s + '" stroke="' + stroke + '" stroke-width="2.4"/>' +
    '<line x1="' + (cx - sw2 + 3) + '" y1="' + (neckTop - 2) + '" x2="' + (cx + sw2 - 3) + '" y2="' + (neckTop - 2) +
    '" stroke="' + stroke + '" stroke-width="2" opacity="0.45"/>';

  const lw = cfg.lw || 72, lh = cfg.lh || 46, lx = cx - lw / 2;
  const ly = by - (cfg.lyoff || 26) - lh;      // canto inferior do rótulo a cfg.lyoff acima da base
  const ffF = cfg.ff || 15.5, ffN = cfg.fn || 8;
  const fY = ly + lh * 0.52, nY = ly + lh * 0.87;   // fórmula em cima, nome embaixo (proporcional à altura)
  const label = '<g>' +
    '<rect x="' + lx + '" y="' + ly + '" width="' + lw + '" height="' + lh + '" rx="5" fill="#efe4c6" stroke="#c9b587" stroke-width="1.5"/>' +
    '<rect x="' + lx + '" y="' + ly + '" width="' + lw + '" height="' + lh + '" rx="5" fill="url(#gLabel)"/>' +
    '<text x="' + cx + '" y="' + fY + '" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="' + ffF + '" font-weight="700" fill="#2c2013">' + (cfg.fHTML || subFormula(cfg.f)) + '</text>' +
    '<text x="' + cx + '" y="' + nY + '" text-anchor="middle" textLength="' + (lw - 10) + '" lengthAdjust="spacingAndGlyphs" font-family="system-ui,Segoe UI,sans-serif" font-size="' + ffN + '" fill="#6a5636">' + cfg.n + '</text>' +
    '</g>';

  return '<g>' + content +
    '<path d="' + sil + '" fill="' + cfg.g + '"/>' + gloss +
    '<path d="' + sil + '" fill="none" stroke="' + stroke + '" stroke-width="2.6" stroke-linejoin="round"/>' +
    stopper + label + '</g>';
}

// números de átomos subscritos em qualquer fórmula (usar daqui pra frente)
function fmtFormula(f) { return f.replace(/([A-Za-z\)\]])(\d+)/g, '$1<sub>$2</sub>'); }

// subscreve dígitos e destaca cada "OH" com <tspan class="fOH"> (pra pulsar no brilho rosa)
function fmtOHFormula(f) {
  let o = '';
  for (let i = 0; i < f.length; i++) {
    const ch = f[i];
    if (ch === 'O' && f[i + 1] === 'H') { o += '<tspan class="fOH">OH</tspan>'; i++; }
    else if (ch >= '0' && ch <= '9') { o += '<tspan baseline-shift="sub" font-size="70%">' + ch + '</tspan>'; }
    else o += ch;
  }
  return o;
}

// subscreve dígitos e destaca o oxigênio "O" com <tspan class="fO"> (pra pulsar no brilho ferrugem)
function fmtOxideFormula(f) {
  let o = '';
  for (const ch of f) {
    if (ch === 'O') o += '<tspan class="fO">O</tspan>';
    else if (ch >= '0' && ch <= '9') o += '<tspan baseline-shift="sub" font-size="70%">' + ch + '</tspan>';
    else o += ch;
  }
  return o;
}

// Imagem com Ken Burns. opts: { fit, pos, origin, from, cap }
function mostrarImg2(src, opts) {
  opts = opts || {};
  if (storyImgImg.getAttribute('src') !== src) storyImgImg.setAttribute('src', src);
  storyImgImg.style.transition = 'none';                 // zera o Ken Burns anterior
  storyImgImg.style.objectFit = opts.fit || 'cover';
  storyImgImg.style.objectPosition = opts.pos || 'center';
  storyImgImg.style.transformOrigin = opts.origin || 'center';
  storyImgImg.style.transform = opts.from || 'scale(1.04)';
  if (opts.cap) { storyImgCap.textContent = opts.cap; storyImgEl.classList.add('cap-on'); }
  else storyImgEl.classList.remove('cap-on');
  void storyImgImg.offsetWidth;
  requestAnimationFrame(() => storyImgEl.classList.add('show'));
}
// Ken Burns até 'to' em 'dur' ms. to: { transform, pos }
// Pan de imagem larga = animar object-position (desliza o recorte, sem bordas); zoom = transform.
function kenBurns(dur, to) {
  to = to || {};
  storyImgImg.style.transition = 'transform ' + dur + 'ms linear, object-position ' + dur + 'ms linear';
  requestAnimationFrame(() => {
    if (to.transform !== undefined) storyImgImg.style.transform = to.transform;
    if (to.pos !== undefined) storyImgImg.style.objectPosition = to.pos;
  });
}
function esconderImg2() { storyImgEl.classList.remove('show'); }

// H+ vira sobrescrito; caret pisca enquanto digita
function montarDef(s, digitando) {
  let h = s.split('H+').join('H<sup>+</sup>');
  return digitando ? h + '<span class="caret">▏</span>' : h;
}
// máquina de escrever guiada pelo tempo do áudio (t0 -> t1)
function digitarDef(texto, t0, t1) {
  defTextoEl.classList.add('show');
  if (typeRAF) cancelAnimationFrame(typeRAF);
  const n = texto.length;
  const tick = () => {
    const p = Math.max(0, Math.min(1, (player.currentTime - t0) / (t1 - t0)));
    defTextoEl.innerHTML = montarDef(texto.slice(0, Math.round(p * n)), p < 1);
    typeRAF = p < 1 ? requestAnimationFrame(tick) : null;
  };
  tick();
}
function resetCena13() {
  if (typeRAF) { cancelAnimationFrame(typeRAF); typeRAF = null; }
  tituloDefEl.classList.remove('show', 'subiu');
  defTextoEl.classList.remove('show');
  defTextoEl.innerHTML = '';
}

// arraste horizontal (revela esquerda/direita), com limite nas bordas
panImgEl.addEventListener('pointerdown', e => {
  imgDrag = { id: e.pointerId, startX: e.clientX, baseX: imgPanX };
  panImgEl.setPointerCapture(e.pointerId);
  panImgEl.classList.add('grabbing');
});
panImgEl.addEventListener('pointermove', e => {
  if (!imgDrag || e.pointerId !== imgDrag.id) return;
  imgPanX = Math.max(imgMinX, Math.min(0, imgDrag.baseX + (e.clientX - imgDrag.startX)));
  aplicarPanImg();
});
function fimDragImg(e) {
  if (imgDrag && e.pointerId === imgDrag.id) { imgDrag = null; panImgEl.classList.remove('grabbing'); }
}
panImgEl.addEventListener('pointerup', fimDragImg);
panImgEl.addEventListener('pointercancel', fimDragImg);

// ---------- Mãozinha do tutorial ----------
const tutorHand = $id('tutorHand');
function centro(el, offY = 0) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 + offY };
}
function maoMostrar(p) {
  tutorHand.style.transition = 'none';
  tutorHand.style.left = p.x + 'px';
  tutorHand.style.top = p.y + 'px';
  requestAnimationFrame(() => {
    tutorHand.style.transition = '';
    tutorHand.classList.add('show');
  });
}
function maoMover(p, dur = 1200) {
  tutorHand.style.transitionDuration = dur + 'ms, ' + dur + 'ms, .4s';
  tutorHand.style.left = p.x + 'px';
  tutorHand.style.top = p.y + 'px';
}
function maoClique() {
  tutorHand.classList.remove('tap');
  void tutorHand.offsetWidth;  // reinicia a animação
  tutorHand.classList.add('tap');
}
function rodarStory(cues) {
  limparStory();
  storyCues = cues.map(c => ({ t: c.t, fn: c.fn, feito: false }));
  const tick = () => {
    const ct = player.currentTime;
    for (const c of storyCues) if (!c.feito && ct >= c.t) { c.feito = true; c.fn(); }
    storyRAF = requestAnimationFrame(tick);
  };
  storyRAF = requestAnimationFrame(tick);
}
